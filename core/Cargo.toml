[package]
name = "switchman-core"
version.workspace = true
edition.workspace = true

[lib]
name = "switchman_core"

[dependencies]
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
lnk = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[lints]
workspace = true
