[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Lo mecánico lo bloquea el linter (Mr. Fixit no lo detecta de forma fiable).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
let_underscore_must_use = "deny"
