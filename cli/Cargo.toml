[package]
name = "switchman-cli"
version.workspace = true
edition.workspace = true

[dependencies]
switchman-core = { path = "../core" }
serde = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
